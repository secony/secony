<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="489" viewBox="0 0 1000 489" role="img" aria-label="Guilherme Secone Neves, de São José do Rio Preto, estuda Análise e Desenvolvimento de Sistemas na FATEC, com foco em Java, orientação a objetos e backend. Escolhi o backend porque quero entender o que acontece entre o clique de quem usa o sistema e o dado salvo: a requisição chega, as regras são aplicadas, o banco responde. Aprendo construindo projetos reais e uso IA como apoio, mas só considero algo meu quando consigo explicar como funciona." xmlns:c2pa="http://c2pa.org/manifest">

